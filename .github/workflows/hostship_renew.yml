name: HostShip Auto Renew

on:
  schedule:
    - cron: '0 3 */7 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Renew Script
        env:
          PANEL_COOKIE: ${{ secrets.PANEL_COOKIE }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HOSTSHIP_ROTATED_FILE: ${{ runner.temp }}/hostship_rotated_cookie.txt
        run: python hostship_renew.py

      - name: Write back rotated cookie
        if: always()
        env:
          GH_TOKEN: ${{ secrets.HOSTSHIP_SECRET_WRITER }}
          ROTATED_FILE: ${{ runner.temp }}/hostship_rotated_cookie.txt
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOSTSHIP_SECRET_WRITER not configured, skip write-back."
            exit 0
          fi
          if [ -s "$ROTATED_FILE" ]; then
            gh secret set PANEL_COOKIE --repo "$GITHUB_REPOSITORY" < "$ROTATED_FILE" \
              && echo "PANEL_COOKIE rotated and written back." \
              || echo "::warning::Failed to write back PANEL_COOKIE."
            rm -f "$ROTATED_FILE"
          else
            echo "No cookie rotation this run."
          fi

      - name: Keep Repo Active
        env:
          GH_TOKEN: ${{ secrets.HOSTSHIP_SECRET_WRITER }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No writer token, skip keep-alive commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > keep_alive.txt
          if git diff --quiet keep_alive.txt; then
            echo "keep_alive.txt unchanged."
          else
            git add keep_alive.txt
            git commit -m "chore: keep repo active"
            git push || echo "::warning::keep-alive push failed."
          fi
